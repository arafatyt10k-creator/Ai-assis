<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1931" />
      <stop offset="60%" stop-color="#040914" />
      <stop offset="100%" stop-color="#02050a" />
    </radialGradient>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect width="512" height="512" rx="112" fill="none" stroke="url(#cyanPurple)" stroke-width="4" stroke-opacity="0.6" />
  <!-- Outer Orbital Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="145" fill="none" stroke="#8b5cf6" stroke-width="2.5" stroke-opacity="0.4" />
  <!-- Rotating Orbital Node Dots -->
  <circle cx="256" cy="76" r="8" fill="#00f0ff" filter="url(#glow)" />
  <circle cx="390" cy="310" r="6" fill="#8b5cf6" filter="url(#glow)" />
  <circle cx="120" cy="290" r="5" fill="#ec4899" filter="url(#glow)" />
  <!-- Hexagonal Core Matrix Shield -->
  <polygon points="256,120 374,188 374,324 256,392 138,324 138,188"
            fill="#061325" fill-opacity="0.8"
            stroke="url(#neonCyan)" stroke-width="4" filter="url(#glow)" />
  <!-- Inner Hologram Waveform / Core Symbol 'M' -->
  <path d="M 190 330 L 190 200 L 256 265 L 322 200 L 322 330"
         fill="none"
         stroke="url(#cyanPurple)"
         stroke-width="16"
         stroke-linecap="round"
         stroke-linejoin="round"
         filter="url(#glow)" />
  <!-- Central Energy Core Spark -->
  <circle cx="256" cy="265" r="12" fill="#00f0ff" filter="url(#glow)" />
  <circle cx="256" cy="265" r="5" fill="#ffffff" />
</svg>
