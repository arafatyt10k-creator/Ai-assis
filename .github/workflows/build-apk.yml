name: Build MAYRA AI Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Make Gradle Executable
        run: |
          cd android && chmod +x ./gradlew || true

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mayra-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          tag_name: v1.0.0-${{ github.run_number }}
          name: MAYRA AI Android Release v1.0.0
          body: |
            ### 📱 MAYRA AI Android APK Build
            - Built automatically for Android phones (Min SDK 24 / Android 7.0+).
            - Includes Real-time Gemini Voice, Hologram, Vision Scanner, and Mobile Integrations.
            
            **Direct Download:** Download `app-debug.apk` below and install on your phone!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
